<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Sczyra Trailer</title>
<style>
  @font-face { font-family: 'Pixelify'; src: url(fonts/pixelify-700.woff2) format('woff2'); font-weight: 700; }
  @font-face { font-family: 'PS2P'; src: url(fonts/press-start-2p.woff2) format('woff2'); }
  @font-face { font-family: 'Silk'; src: url(fonts/silkscreen.woff2) format('woff2'); }
  html, body { margin: 0; padding: 0; background: #000; }
  #stage { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script>
// Sczyra – 20 s character trailer, 16:9 1920x1080.
// render(t) is a pure function of time, so render.js can step it frame by frame at 60 fps.
// Characters are drawn through a small WebGL "warp" shader: per-region sine displacement
// (hair, sleeves, cloth, tassel) + breathing + body sway, which turns the static sheet art
// into smooth idle motion. Everything else (sky, parallax world, FX, text) is canvas 2D.

const W = 1920, H = 1080;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');

// ---------------------------------------------------------------- helpers
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = {
  inCubic: p => p * p * p,
  outCubic: p => 1 - Math.pow(1 - p, 3),
  inOut: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  sine: p => .5 - .5 * Math.cos(Math.PI * p),
  outBack: (p, k = 1.7) => 1 + (k + 1) * Math.pow(p - 1, 3) + k * Math.pow(p - 1, 2),
  outElastic: p => p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, -9 * p) * Math.sin((p * 8 - .75) * (2 * Math.PI) / 3) + 1,
};
const DEG = Math.PI / 180;
function rng(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
// nearest-neighbour upscale (keeps pixel art crisp before smooth sub-pixel placement)
function upscale(src, f) {
  const c = canvas(src.width * f, src.height * f), x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  x.drawImage(src, 0, 0, c.width, c.height);
  return c;
}

// ---------------------------------------------------------------- assets
const NAMES = ['hero', 'idle', 'attack', 'jump', 'front', 'side', 'back', 'side2', 'rig_body', 'rig_thigh', 'rig_shin',
  'e_neutral', 'e_happy', 'e_wink', 'e_surprised'];
const IMG = {};
const UP = {};
function up(name, f) { const k = name + '@' + f; return UP[k] || (UP[k] = upscale(IMG[name], f)); }

// ---------------------------------------------------------------- WebGL warp
const glc = canvas(W, H);
const gl = glc.getContext('webgl', { premultipliedAlpha: true, preserveDrawingBuffer: true, alpha: true, antialias: false });
const VS = `
attribute vec2 aUV;
uniform vec2 uSrc; uniform float uMargin; uniform mat3 uMat;
varying vec2 vP;
void main() {
  vec2 p = aUV * (uSrc + 2.0 * uMargin) - uMargin;
  vP = p;
  vec3 s = uMat * vec3(p, 1.0);
  gl_Position = vec4(s.x / 960.0 - 1.0, 1.0 - s.y / 540.0, 0.0, 1.0);
}`;
const FS = `
precision highp float;
varying vec2 vP;
uniform sampler2D uTex; uniform vec2 uSrc; uniform float uT; uniform float uAlpha; uniform vec4 uTint;
uniform vec4 uR[8]; uniform vec4 uF[8]; uniform vec4 uA[8]; uniform vec4 uB[8]; uniform int uN;
uniform vec4 uBreath; uniform vec2 uSway;
float ramp(float a, float b, float x) { float s = clamp((x - a) / (b - a), 0.0, 1.0); return s * s * (3.0 - 2.0 * s); }
float box(vec2 p, vec4 r, float f) {
  return ramp(r.x - f, r.x + f, p.x) * (1.0 - ramp(r.z - f, r.z + f, p.x)) *
         ramp(r.y - f, r.y + f, p.y) * (1.0 - ramp(r.w - f, r.w + f, p.y));
}
vec2 disp(vec2 p) {
  vec2 d = vec2(0.0);
  for (int i = 0; i < 8; i++) {
    if (i >= uN) break;
    vec4 r = uR[i], f = uF[i], a = uA[i], b = uB[i];
    float w = box(p, r, f.x) * ramp(f.y, f.z, p.y);
    float ph = uT * a.z - p.y * a.w + f.w;
    d.x += w * (a.x * sin(ph) + b.x * sin(uT * b.y - p.y * b.z + f.w * 1.7));
    d.y += w * a.y * sin(ph * 0.8 + 1.3);
  }
  float br = uBreath.x * (0.5 + 0.5 * sin(uT * uBreath.y));
  d.y -= br * ramp(uBreath.w, uBreath.z, p.y);
  float h = 1.0 - p.y / uSrc.y;
  d.x += uSway.x * sin(uT * uSway.y) * h * h;
  return d;
}
void main() {
  vec2 q = vP - disp(vP);
  if (q.x < 0.0 || q.y < 0.0 || q.x > uSrc.x || q.y > uSrc.y) { gl_FragColor = vec4(0.0); return; }
  vec4 c = texture2D(uTex, q / uSrc);
  c.rgb = mix(c.rgb, uTint.rgb * c.a, uTint.a);
  gl_FragColor = c * uAlpha;
}`;
function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
gl.useProgram(prog);
const U = {};
for (const n of ['uSrc', 'uMargin', 'uMat', 'uTex', 'uT', 'uAlpha', 'uTint', 'uR', 'uF', 'uA', 'uB', 'uN', 'uBreath', 'uSway'])
  U[n] = gl.getUniformLocation(prog, n);
const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 0, 1, 1, 0, 1, 1]), gl.STATIC_DRAW);
const aUV = gl.getAttribLocation(prog, 'aUV');
gl.enableVertexAttribArray(aUV);
gl.vertexAttribPointer(aUV, 2, gl.FLOAT, false, 0, 0);
gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
gl.viewport(0, 0, W, H);
const TEX = {};
function texture(name, f) {
  const k = name + '@' + f;
  if (TEX[k]) return TEX[k];
  const tx = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tx);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, up(name, f));
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return TEX[k] = tx;
}

// motion region: rect, feather, weight ramp (y from r0 to r1), phase, wave A (ampX, ampY, freq, k), wave B (amp, freq, k)
const R = (x0, y0, x1, y1, fe, r0, r1, ph, ax, ay, fr, k, bx = 0, bf = 0, bk = 0) =>
  ({ r: [x0, y0, x1, y1], f: [fe, r0, r1, ph], a: [ax, ay, fr, k], b: [bx, bf, bk, 0] });
// full-art pose (coords in the 442x1125 hero cut)
const HERO_RIG = {
  regions: [
    R(25, 110, 215, 600, 30, 140, 520, 0, 7, 1.5, 1.7, .011, 2.5, 2.9, .024),     // long hair
    R(20, 380, 205, 960, 28, 380, 900, .8, 9, 2, 1.3, .009, 3, 2.3, .02),          // hanging sleeve / drape
    R(330, 330, 430, 575, 20, 340, 560, 2, 4, 1, 1.5, .015, 1.5, 2.6, .03),        // right sleeve
    R(385, 570, 432, 720, 12, 575, 705, 1, 6, 0, 2.1, .02, 2, 3.3, .03),           // tassel
    R(120, 0, 262, 135, 22, 125, 10, .4, 3, .8, 1.9, .02, 1, 3.1, .03),            // ponytail + ornaments
  ],
  breath: [3, 1.8, 250, 600], sway: [5, .9],
};
const PORTRAIT_RIG = {
  regions: [
    R(0, 20, 48, 148, 10, 25, 148, 0, 1.8, .4, 1.6, .04, .6, 2.7, .07),
    R(108, 20, 152, 148, 10, 25, 148, 1.4, 1.6, .4, 1.7, .04, .6, 2.9, .07),
  ],
  breath: [1.4, 1.8, 0, 148], sway: [0, 0],
};
const SPRITE_RIG = {};
function spriteRig(n) {
  if (SPRITE_RIG[n]) return SPRITE_RIG[n];
  const w = IMG[n].width, h = IMG[n].height;
  return SPRITE_RIG[n] = {
    regions: [
      R(0, h * .08, w * .55, h * .62, 5, h * .15, h * .55, 0, 1.3, .3, 3.2, .06, .5, 5.1, .1),  // hair
      R(0, h * .45, w, h * .8, 5, h * .45, h * .72, 1.1, 1.0, .3, 3.6, .05, .4, 5.7, .09),     // skirt / sleeves
    ],
    breath: [1.2, 3.0, h * .1, h * .55], sway: [0, 0],
  };
}

let CAM = new DOMMatrix();
// draw `name` through the warp shader. m maps source px -> world px (camera applied here).
function warp(name, m, { rig, t = 0, alpha = 1, tint = null, op = 'source-over', cam = CAM, target = ctx } = {}) {
  if (alpha <= 0.002) return;
  const img = IMG[name];
  const full = cam.multiply(m);
  const scale = Math.hypot(full.a, full.b);
  const f = clamp(Math.ceil(scale - .15), 1, 6);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindTexture(gl.TEXTURE_2D, texture(name, f));
  gl.uniform1i(U.uTex, 0);
  gl.uniform2f(U.uSrc, img.width, img.height);
  gl.uniform1f(U.uMargin, 24);
  gl.uniformMatrix3fv(U.uMat, false, [full.a, full.b, 0, full.c, full.d, 0, full.e, full.f, 1]);
  gl.uniform1f(U.uT, t);
  gl.uniform1f(U.uAlpha, alpha);
  gl.uniform4fv(U.uTint, tint || [1, 1, 1, 0]);
  const regs = (rig && rig.regions) || [];
  const pack = k => { const a = new Float32Array(32); regs.forEach((r, i) => a.set(r[k], i * 4)); return a; };
  gl.uniform4fv(U.uR, pack('r')); gl.uniform4fv(U.uF, pack('f'));
  gl.uniform4fv(U.uA, pack('a')); gl.uniform4fv(U.uB, pack('b'));
  gl.uniform1i(U.uN, regs.length);
  gl.uniform4fv(U.uBreath, (rig && rig.breath) || [0, 0, 0, 1]);
  gl.uniform2fv(U.uSway, (rig && rig.sway) || [0, 0]);
  gl.drawArrays(gl.TRIANGLES, 0, 6);
  target.save();
  target.setTransform(1, 0, 0, 1, 0, 0);
  target.globalCompositeOperation = op;
  target.drawImage(glc, 0, 0);
  target.restore();
}
// place source anchor (ax, ay) at world (x, y), scaled and rotated (deg) around that anchor
const place = (x, y, sx, sy, rot, ax, ay) => new DOMMatrix().translate(x, y).rotate(rot || 0).scale(sx, sy).translate(-ax, -ay);

// sprite anchored bottom-centre (feet) at world (x, y)
const S = 2.7; // sprite pixel scale in the world scenes
function sprite(name, x, y, t, { scale = S, sx = 1, sy = 1, rot = 0, alpha = 1, tint = null, op } = {}) {
  const img = IMG[name];
  warp(name, place(x, y, scale * sx, scale * sy, rot, img.width / 2, img.height), { rig: spriteRig(name), t, alpha, tint, op });
}
// cross-fade between two poses (same anchor)
function spriteMix(a, b, p, x, y, t, o = {}) {
  if (p < 1) sprite(a, x, y, t, { ...o, alpha: (o.alpha ?? 1) * (p > 0 ? 1 - p * .35 : 1) });
  if (p > 0) sprite(b, x, y, t, { ...o, alpha: (o.alpha ?? 1) * p });
}
function hero(x, feetY, h, t, o = {}) {
  const s = h / 1125;
  warp('hero', place(x, feetY, s, s, o.rot || 0, 221, 1125), { rig: HERO_RIG, t, alpha: o.alpha ?? 1, tint: o.tint });
}

// ---------------------------------------------------------------- procedural pixel art
let STARS, PETALS, BOKEH, MOON, SLIME, FAR, MID, BAMBOO, GROUND, FORE, VIGNETTE;
function buildArt() {
  const r = rng(11);
  STARS = Array.from({ length: 170 }, () => ({
    x: r() * W, y: r() * H * .72, s: r() < .15 ? 6 : r() < .5 ? 4 : 2,
    f: 1 + r() * 3, p: r() * 7, c: r() < .2 ? '#ffe9b0' : r() < .5 ? '#bcd3ff' : '#ffffff',
  }));
  PETALS = Array.from({ length: 70 }, () => ({
    x: r() * (W + 400), y: r() * (H + 200), v: 60 + r() * 90, a: 20 + r() * 50, f: .6 + r() * 1.4,
    p: r() * 7, s: 1 + Math.floor(r() * 3), spin: 2 + r() * 5, c: r() < .55 ? '#f4f6ff' : r() < .6 ? '#ffd6e8' : '#9fc0ff',
    d: .5 + r() * .7,
  }));
  BOKEH = Array.from({ length: 22 }, () => ({
    x: r() * W, y: r() * H, r: 40 + r() * 150, v: 10 + r() * 30, p: r() * 7, a: .05 + r() * .13,
    c: r() < .5 ? '120,170,255' : r() < .5 ? '255,255,255' : '180,140,255',
  }));

  // moon 64x64 -> x4
  {
    const c = canvas(64, 64), x = c.getContext('2d');
    for (let j = 0; j < 64; j++) for (let i = 0; i < 64; i++) {
      const dx = i - 31.5, dy = j - 31.5, d = Math.hypot(dx, dy);
      if (d > 29) continue;
      let col = '#eef3ff';
      if (dx < -14 && d > 20) col = '#c6d4f6';
      if (d > 27) col = '#b4c5ef';
      for (const [cx, cy, cr] of [[40, 22, 5], [24, 38, 4], [38, 42, 3], [20, 20, 2.5], [46, 34, 2]])
        if (Math.hypot(i - cx, j - cy) < cr) col = '#cfdaf5';
      x.fillStyle = col; x.fillRect(i, j, 1, 1);
    }
    MOON = upscale(c, 4);
  }

  // slime 40x32 -> x5
  {
    const c = canvas(40, 32), x = c.getContext('2d');
    for (let j = 0; j < 32; j++) for (let i = 0; i < 40; i++) {
      const nx = (i - 19.5) / 19.5, ny = (j - 31) / 27;
      const d = nx * nx + ny * ny * (ny < 0 ? 1 : 8);
      if (d > 1) continue;
      let col = '#b44ee0';
      if (nx * .6 - ny * .4 > .55 || j > 27) col = '#8a2fb8';
      if (d > .78) col = '#4a1468';
      if (Math.hypot((i - 11) / 4, (j - 10) / 2.6) < 1) col = '#f2b8ff';
      if (Math.hypot((i - 7) / 1.5, (j - 15) / 1.5) < 1) col = '#e08cff';
      x.fillStyle = col; x.fillRect(i, j, 1, 1);
    }
    x.fillStyle = '#fff'; x.fillRect(13, 15, 4, 6); x.fillRect(23, 15, 4, 6);
    x.fillStyle = '#1b0830'; x.fillRect(15, 17, 2, 4); x.fillRect(24, 17, 2, 4);
    x.fillRect(12, 13, 2, 1); x.fillRect(14, 14, 3, 1); x.fillRect(26, 13, 2, 1); x.fillRect(23, 14, 3, 1); // angry brows
    x.fillRect(18, 24, 4, 1); x.fillRect(17, 23, 1, 1); x.fillRect(22, 23, 1, 1);
    SLIME = upscale(c, 5);
  }

  // parallax layers: tileable 640 px low-res, upscaled x4 -> 2560 px
  const TW = 640, wave = (i, terms) => terms.reduce((s, [a, n, p]) => s + a * Math.sin(2 * Math.PI * n * i / TW + p), 0);
  {
    const c = canvas(TW, 270), x = c.getContext('2d');
    for (let i = 0; i < TW; i++) {
      const y = Math.round(140 + wave(i, [[26, 2, 1], [16, 5, 0], [7, 11, 2], [3, 23, 1]]));
      x.fillStyle = '#212d66'; x.fillRect(i, y, 1, 270 - y);
      x.fillStyle = '#3a4c94'; x.fillRect(i, y, 1, 1);
      const yn = Math.round(140 + wave(i + 1, [[26, 2, 1], [16, 5, 0], [7, 11, 2], [3, 23, 1]]));
      if (yn > y) { x.fillStyle = '#2f3f84'; x.fillRect(i, y + 1, 1, 2); }
      if (y < 125) { x.fillStyle = '#7c90d0'; x.fillRect(i, y, 1, Math.min(4, 125 - y)); }
    }
    FAR = upscale(c, 4);
  }
  {
    const c = canvas(TW, 270), x = c.getContext('2d');
    for (let i = 0; i < TW; i++) {
      const y = Math.round(196 + wave(i, [[10, 3, 2], [6, 7, 1], [3, 17, 0]]));
      x.fillStyle = '#18204d'; x.fillRect(i, y, 1, 270 - y);
      x.fillStyle = '#26326a'; x.fillRect(i, y, 1, 1);
    }
    const pagoda = (px, base, tiers) => {
      let y = base;
      for (let k = 0; k < tiers; k++) {
        const w = 26 - k * 4;
        x.fillStyle = '#121838'; x.fillRect(px - w / 2 + 3, y - 10, w - 6, 10);
        x.fillStyle = '#ffcf6b'; if (k < tiers - 1) { x.fillRect(px - 3, y - 7, 2, 3); x.fillRect(px + 2, y - 7, 2, 3); }
        x.fillStyle = '#0e132e'; x.fillRect(px - w / 2 - 2, y - 13, w + 4, 3); x.fillRect(px - w / 2 - 4, y - 12, 2, 1); x.fillRect(px + w / 2 + 2, y - 12, 2, 1);
        y -= 13;
      }
      x.fillStyle = '#0e132e'; x.fillRect(px - 1, y - 8, 2, 8);
    };
    pagoda(110, 200, 5); pagoda(470, 198, 4);
    const torii = (px, base) => {
      x.fillStyle = '#5a1f3e'; x.fillRect(px - 14, base - 30, 3, 30); x.fillRect(px + 11, base - 30, 3, 30);
      x.fillRect(px - 19, base - 33, 38, 3); x.fillRect(px - 15, base - 26, 30, 2);
      x.fillStyle = '#7a2c52'; x.fillRect(px - 19, base - 33, 38, 1);
    };
    torii(300, 197); torii(600, 199);
    for (const [px, py, rr] of [[40, 192, 9], [180, 190, 12], [230, 194, 8], [380, 192, 11], [540, 194, 10]]) {
      for (let j = -rr; j <= rr; j++) for (let i = -rr; i <= rr; i++)
        if (i * i + j * j * 1.4 < rr * rr) { x.fillStyle = (i + j < -rr * .5) ? '#24305f' : '#151c45'; x.fillRect(px + i, py + j - rr, 1, 1); }
    }
    MID = upscale(c, 4);
  }
  {
    const c = canvas(TW, 270), x = c.getContext('2d'), rb = rng(5);
    for (let g = 0; g < 9; g++) {
      const gx = g * 71 + 20;
      for (let s = 0; s < 4; s++) {
        const sx = gx + s * 6 + Math.floor(rb() * 4), top = Math.floor(rb() * 60);
        x.fillStyle = '#163a64'; x.fillRect(sx, top, 3, 270 - top);
        x.fillStyle = '#20507e'; x.fillRect(sx, top, 1, 270 - top);
        for (let ny = top + 10 + Math.floor(rb() * 10); ny < 270; ny += 22) { x.fillStyle = '#0f2a4a'; x.fillRect(sx - 1, ny, 5, 1); }
        for (let k = 0; k < 6; k++) {
          const ly = top + Math.floor(rb() * 150), dir = rb() < .5 ? -1 : 1;
          x.fillStyle = '#1d4e78';
          for (let q = 0; q < 7; q++) x.fillRect(sx + 1 + dir * (2 + q), ly + Math.floor(q / 2), 1, 2);
        }
      }
    }
    BAMBOO = upscale(c, 4);
  }
  {
    const c = canvas(TW, 40), x = c.getContext('2d'), rg = rng(9);
    x.fillStyle = '#23284f'; x.fillRect(0, 0, TW, 40);
    for (let row = 0; row < 5; row++) {
      let sx = row % 2 ? -6 : 0;
      while (sx < TW) {
        const w = 10 + Math.floor(rg() * 8), y = 4 + row * 7;
        x.fillStyle = row === 0 ? '#3c4686' : '#2f3769'; x.fillRect(sx + 1, y, w - 1, 6);
        x.fillStyle = row === 0 ? '#5361a6' : '#3c4683'; x.fillRect(sx + 1, y, w - 1, 1);
        sx += w;
      }
    }
    x.fillStyle = '#1f5f68'; x.fillRect(0, 0, TW, 3);
    x.fillStyle = '#3b8f8c';
    for (let i = 0; i < TW; i += 1) if (rg() < .45) x.fillRect(i, rg() < .5 ? 0 : -1, 1, 2);
    GROUND = upscale(c, 4);
  }
  {
    const c = canvas(TW, 50), x = c.getContext('2d'), rf = rng(3);
    for (let i = 0; i < TW; i += 2 + Math.floor(rf() * 4)) {
      const h = 6 + Math.floor(rf() * 18);
      x.fillStyle = rf() < .5 ? '#0d2533' : '#12303f';
      x.fillRect(i, 50 - h, 2, h); x.fillRect(i - 1, 50 - h + 3, 1, h - 3);
      if (rf() < .08) { x.fillStyle = '#9fc0ff'; x.fillRect(i, 50 - h - 2, 2, 2); }
    }
    FORE = upscale(c, 4);
  }
  {
    VIGNETTE = canvas(W, H);
    const x = VIGNETTE.getContext('2d'), g = x.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * 1.05);
    g.addColorStop(0, 'rgba(3,5,20,0)'); g.addColorStop(1, 'rgba(3,5,20,.55)');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
  }
}

// ---------------------------------------------------------------- shared drawing
function sky(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#060a22'); g.addColorStop(.55, '#151f58'); g.addColorStop(1, '#2c3d8a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const s of STARS) {
    ctx.globalAlpha = .3 + .7 * (.5 + .5 * Math.sin(t * s.f + s.p));
    ctx.fillStyle = s.c; ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;
}
function moon(x, y) {
  const g = ctx.createRadialGradient(x, y, 80, x, y, 460);
  g.addColorStop(0, 'rgba(160,195,255,.42)'); g.addColorStop(1, 'rgba(110,140,255,0)');
  ctx.fillStyle = g; ctx.fillRect(x - 460, y - 460, 920, 920);
  ctx.drawImage(MOON, x - 128, y - 128);
}
function tile(img, offset, y, alpha = 1) {
  const w = img.width;
  let x = -(((offset % w) + w) % w) - w;
  ctx.globalAlpha = alpha;
  for (; x < W + 200; x += w) ctx.drawImage(img, x, y);
  ctx.globalAlpha = 1;
}
function mist(t, y, a, speed) {
  for (let k = 0; k < 2; k++) {
    const g = ctx.createLinearGradient(0, y - 90, 0, y + 90);
    g.addColorStop(0, 'rgba(140,170,255,0)'); g.addColorStop(.5, `rgba(140,170,255,${a})`); g.addColorStop(1, 'rgba(140,170,255,0)');
    ctx.fillStyle = g;
    const off = (t * speed * (k ? 1.6 : 1)) % 1400;
    for (let x = -1400 - off; x < W + 1400; x += 1400) {
      ctx.beginPath(); ctx.ellipse(x + 700 + k * 500, y + k * 30, 900, 70, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
}
function petals(t, alpha = 1, wind = 70) {
  for (const p of PETALS) {
    const y = ((p.y + p.v * t) % (H + 200)) - 100;
    const x = ((p.x - wind * t + Math.sin(t * p.f + p.p) * p.a) % (W + 400) + W + 400) % (W + 400) - 200;
    const flip = Math.cos(t * p.spin + p.p);
    const s = p.s * 4 * p.d + 2;
    ctx.save();
    ctx.globalAlpha = alpha * (.55 + .45 * p.d);
    ctx.translate(x, y); ctx.rotate(t * p.spin * .3 + p.p); ctx.scale(Math.max(.15, Math.abs(flip)), 1);
    ctx.fillStyle = p.c; ctx.fillRect(-s, -s / 2, s * 2, s);
    ctx.fillRect(-s / 2, -s, s, s * 2);
    ctx.restore();
  }
}
function glow(x, y, r, rgb, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function star4(x, y, r, rot, col, a = 1) {
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col; ctx.beginPath();
  for (let i = 0; i < 8; i++) { const rr = i % 2 ? r * .22 : r, an = i * Math.PI / 4; ctx.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); }
  ctx.fill(); ctx.restore();
}
// text with letter-by-letter drop-in. Returns total width.
function dropText(str, x, y, size, t0, t, { font = 'PS2P', weight = 400, spacing = .02, fill = '#fff', fill2 = '#9cc2ff', stroke = '#0b1240', glowCol = '#4d8dff', stagger = .09, align = 'left', alpha = 1 } = {}) {
  ctx.save();
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.textBaseline = 'alphabetic';
  const ws = [...str].map(c => ctx.measureText(c).width + size * spacing);
  const total = ws.reduce((a, b) => a + b, 0) - size * spacing;
  let cx = align === 'center' ? x - total / 2 : x;
  [...str].forEach((c, i) => {
    const p = seg(t, t0 + i * stagger, t0 + i * stagger + .45);
    if (p > 0) {
      const dy = (1 - ease.outBack(p, 2.2)) * -size * .45;
      ctx.globalAlpha = alpha * clamp(p * 2.5);
      const g = ctx.createLinearGradient(0, y - size * .8, 0, y);
      g.addColorStop(0, fill); g.addColorStop(1, fill2);
      ctx.lineJoin = 'round';
      ctx.shadowColor = glowCol; ctx.shadowBlur = size * .25;
      ctx.lineWidth = size * .14; ctx.strokeStyle = stroke; ctx.strokeText(c, cx, y + dy);
      ctx.shadowBlur = 0;
      ctx.fillStyle = g; ctx.fillText(c, cx, y + dy);
    }
    cx += ws[i];
  });
  ctx.restore();
  return total;
}
function spacedText(str, x, y, size, spacing, color, alpha, font = 'Silk', align = 'center') {
  ctx.save();
  ctx.font = `${size}px ${font}`;
  ctx.fillStyle = color; ctx.globalAlpha = alpha; ctx.textBaseline = 'middle';
  const ws = [...str].map(c => ctx.measureText(c).width + spacing);
  const total = ws.reduce((a, b) => a + b, 0) - spacing;
  let cx = align === 'center' ? x - total / 2 : x;
  [...str].forEach((c, i) => { ctx.fillText(c, cx, y); cx += ws[i]; });
  ctx.restore();
  return total;
}
// stepped-corner pixel panel
function pixPanel(x, y, w, h, step, fill, border, bw) {
  const path = (o) => {
    ctx.beginPath();
    const s = step;
    ctx.moveTo(x + s * 2 - o, y - o); ctx.lineTo(x + w - s * 2 + o, y - o); ctx.lineTo(x + w - s * 2 + o, y + s - o);
    ctx.lineTo(x + w - s + o, y + s - o); ctx.lineTo(x + w - s + o, y + s * 2 - o); ctx.lineTo(x + w + o, y + s * 2 - o);
    ctx.lineTo(x + w + o, y + h - s * 2 + o); ctx.lineTo(x + w - s + o, y + h - s * 2 + o); ctx.lineTo(x + w - s + o, y + h - s + o);
    ctx.lineTo(x + w - s * 2 + o, y + h - s + o); ctx.lineTo(x + w - s * 2 + o, y + h + o); ctx.lineTo(x + s * 2 - o, y + h + o);
    ctx.lineTo(x + s * 2 - o, y + h - s + o); ctx.lineTo(x + s - o, y + h - s + o); ctx.lineTo(x + s - o, y + h - s * 2 + o);
    ctx.lineTo(x - o, y + h - s * 2 + o); ctx.lineTo(x - o, y + s * 2 - o); ctx.lineTo(x + s - o, y + s * 2 - o);
    ctx.lineTo(x + s - o, y + s - o); ctx.lineTo(x + s * 2 - o, y + s - o); ctx.closePath();
  };
  ctx.fillStyle = border; path(bw); ctx.fill();
  ctx.fillStyle = fill; path(0); ctx.fill();
}
// pixel dust puffs
function puff(x, y, age, dir = 0, n = 5, scale = 1, col = '190,205,255') {
  if (age < 0 || age > .6) return;
  const p = age / .6;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI - Math.PI + dir;
    const d = (20 + i * 9) * ease.outCubic(p) * scale;
    const s = Math.round((14 - i) * (1 - p) * scale);
    if (s <= 0) continue;
    ctx.fillStyle = `rgba(${col},${.55 * (1 - p)})`;
    ctx.fillRect(x + Math.cos(a) * d - s / 2 - (dir ? 0 : 0), y + Math.sin(a) * d * .5 - s, s, s);
  }
}

// ---------------------------------------------------------------- scene 1 · intro (0 – 3.5)
const HERO1 = { x: 1270, y: 1062, h: 980 };
function sIntro(t) {
  sky(t);
  // camera: slow push, then fast zoom into the face for the close-up cut
  const zi = ease.inCubic(seg(t, 3.0, 3.5));
  const s = HERO1.h / 1125;
  const face = [HERO1.x + (255 - 221) * s, HERO1.y - (1125 - 165) * s];
  const cx = lerp(1270, face[0], zi), cy = lerp(560, face[1], zi);
  const z = lerp(1, 1.05, ease.inOut(seg(t, 0, 3.5))) * lerp(1, 3.2, zi);
  CAM = new DOMMatrix().translate(cx, cy).scale(z).translate(-cx, -cy);
  ctx.setTransform(CAM);
  moon(1560, 250);
  tile(FAR, 40 + t * 6, 0);
  mist(t, 820, .16, 30);
  tile(MID, 300 + t * 14, 160, .95);
  // character
  const a = ease.outCubic(seg(t, .15, 1.2));
  glow(HERO1.x, 600, 520, '90,140,255', .35 * a);

  mist(t + 3, 1010, .12, 50);

    const p = ease.outCubic(seg(t, 1.9, 2.6));
    ctx.fillStyle = '#7fb0ff'; ctx.fillRect(156, 600, 776 * p, 5);
    ctx.save(); ctx.beginPath(); ctx.rect(150, 608, 800 * p, 80); ctx.clip();
    spacedText('THE BLUE CRESCENT', 156, 648, 42, 10, '#d8e6ff', 1, 'Silk', 'left');
    ctx.restore();
    ctx.restore();

}

// ---------------------------------------------------------------- scene 2 · close-up expressions (3.5 – 6)
const EXPR = [[0, 'e_neutral'], [.85, 'e_happy'], [1.6, 'e_wink']];
function sClose(t) {
  const u = t - 3.5;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const g = ctx.createRadialGradient(1150, 540, 50, 1150, 540, 1300);
  g.addColorStop(0, '#2a4aa8'); g.addColorStop(.5, '#152466'); g.addColorStop(1, '#070b26');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // rotating light rays
  ctx.save(); ctx.translate(1150, 540); ctx.rotate(u * .12); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 12; i++) {
    ctx.rotate(Math.PI / 6);
    ctx.fillStyle = 'rgba(120,160,255,.05)';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(1400, -110); ctx.lineTo(1400, 110); ctx.fill();
  }
  ctx.restore();
  // bokeh
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const b of BOKEH) {
    const y = ((b.y - b.v * u * 3) % (H + 300) + H + 300) % (H + 300) - 150;
    glow(b.x + Math.sin(u + b.p) * 30, y, b.r, b.c, b.a);
  }
  ctx.restore();

  // portrait card
  const enter = ease.outCubic(seg(u, 0, .7));
  const exit = ease.inCubic(seg(u, 2.12, 2.45));
  const sc = 4.1 * lerp(1.3, 1, enter) * lerp(1, .9, exit);
  const cx = 1180, cy = 540 + Math.sin(u * 2.1) * 7 + exit * 40;
  const cw = 152 * sc, ch = 148 * sc;
  ctx.save();
  ctx.globalAlpha = 1 - exit;
  ctx.shadowColor = 'rgba(0,0,20,.6)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 20;
  pixPanel(cx - cw / 2 - 18, cy - ch / 2 - 18, cw + 36, ch + 36, 12, '#0d1438', '#e4edff', 6);
  ctx.restore();
  // expression cross-fades on the same warp rig so the face never jumps
  let i = 0;
  while (i + 1 < EXPR.length && u >= EXPR[i + 1][0]) i++;
  const m = place(cx, cy, sc, sc, Math.sin(u * 1.3) * .8, 76, 74);
  const ca = 1 - exit;
  if (i > 0 && u < EXPR[i][0] + .2) {
    warp(EXPR[i - 1][1], m, { rig: PORTRAIT_RIG, t, alpha: ca });
    warp(EXPR[i][1], m, { rig: PORTRAIT_RIG, t, alpha: ca * ease.sine(seg(u, EXPR[i][0], EXPR[i][0] + .2)) });
  } else warp(EXPR[i][1], m, { rig: PORTRAIT_RIG, t, alpha: ca });
  // inner frame on top hides warp edges
  ctx.save(); ctx.globalAlpha = 1 - exit;
  ctx.strokeStyle = '#6f8fe0'; ctx.lineWidth = 14; ctx.strokeRect(cx - cw / 2 - 4, cy - ch / 2 - 4, cw + 8, ch + 8);
  ctx.strokeStyle = '#e4edff'; ctx.lineWidth = 4; ctx.strokeRect(cx - cw / 2 - 12, cy - ch / 2 - 12, cw + 24, ch + 24);
  ctx.restore();

  // happy sparkles
  for (let k = 0; k < 10; k++) {
    const st = .85 + k * .07, age = u - st;
    if (age < 0 || age > 1) continue;
    const ang = k * 2.4;
    const x = cx + Math.cos(ang) * (cw * .55 + age * 60), y = cy + Math.sin(ang) * (ch * .5) - age * 120;
    star4(x, y, 22 * (1 - age), age * 3, k % 2 ? '#ffe9a8' : '#ffffff', 1 - age);
  }
  // wink sparkle
  const wk = u - 1.68;
  if (wk > 0 && wk < .9) {
    const p = ease.outBack(seg(wk, 0, .3), 3), x = cx + (138 - 76) * sc, y = cy + (62 - 74) * sc;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    glow(x, y, 120 * p, '255,240,190', .6 * (1 - seg(wk, .5, .9)));
    ctx.restore();
    star4(x, y, 70 * p, wk * 2, '#fff6d6', 1 - seg(wk, .55, .9));
    star4(x + 70, y - 60, 30 * p, -wk * 3, '#ffffff', 1 - seg(wk, .45, .8));
  }

  // speech bubble
  const lines = [[.3, 1.52, 'Halo, aku Sczyra!'], [1.6, 2.3, 'Ayo berpetualang!']];
  for (const [a, b, txt] of lines) {
    if (u < a || u > b) continue;
    const pin = ease.outBack(seg(u, a, a + .3), 2.4), pout = seg(u, b - .15, b);
    const s = pin * (1 - pout);
    if (s <= 0) continue;
    ctx.save();
    ctx.translate(560, 420); ctx.scale(s, s);
    pixPanel(-330, -70, 660, 140, 10, '#ffffff', '#0d1438', 6);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(300, -10, 40, 30); ctx.fillRect(330, 0, 30, 20); ctx.fillRect(355, 6, 20, 12);
    ctx.fillStyle = '#0d1438'; ctx.fillRect(375, 6, 6, 12); ctx.fillRect(355, 18, 20, 6); ctx.fillRect(330, 20, 25, 6);
    const n = Math.floor(clamp((u - a - .08) / .42) * txt.length);
    ctx.font = '700 58px Pixelify'; ctx.fillStyle = '#1a2a6c'; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
    const full = ctx.measureText(txt).width;
    ctx.textAlign = 'left';
    ctx.fillText(txt.slice(0, n), -full / 2, 4);
    ctx.restore();
  }
}

// ---------------------------------------------------------------- scenes 3+4 · world: walk, run, fight (6 – 13)
const T_WALK = 6.0, T_RUN = 8.4, T_RUN_FULL = 8.9, T_BRAKE = 10.0, T_STOP = 10.5;
const T_ALERT = 10.8, T_CROUCH = 11.1, T_JUMP = 11.25, T_SLASH = 11.75, T_HIT = 11.95, T_LAND = 12.4;
const T_TURN = 13.0, T_FINAL = 17.0;
const GROUND_Y = 935;
const V_WALK = 300, V_RUN = 1100;   // ground speed, px/s
function speed(t) {
  if (t < T_RUN) return V_WALK;
  if (t < T_RUN_FULL) return lerp(V_WALK, V_RUN, ease.sine(seg(t, T_RUN, T_RUN_FULL)));
  if (t < T_BRAKE) return V_RUN;
  return lerp(V_RUN, 0, ease.outCubic(seg(t, T_BRAKE, T_STOP)));
}

// ---- walk / run rig: right-facing side view cut into body + thigh + shin (shared 64x195 frame)
const HIP = [47, 118], KNEE = [42, 158], HEEL = [31, 194], TOE = [52, 194];
// A: hip swing (deg), s: stance fraction, kSt/kSw: knee bend in stance/swing, lean: torso (deg), arm: arm swing (px)
const GAIT_WALK = { A: 20, s: .6, kSt: 8, kSw: 55, lean: 2, arm: 3.2 };
const GAIT_RUN = { A: 31, s: .38, kSt: 20, kSw: 105, lean: 9, arm: 6.5 };
const runMix = t => clamp((speed(t) - V_WALK) / (V_RUN - V_WALK));
function gait(m) { const o = {}; for (const k in GAIT_WALK) o[k] = lerp(GAIT_WALK[k], GAIT_RUN[k], m); return o; }
function rot2(v, deg) { const a = deg * DEG, c = Math.cos(a), s = Math.sin(a); return [v[0] * c - v[1] * s, v[0] * s + v[1] * c]; }
// leg forward kinematics in source px relative to the hip. th > 0 swings the leg forward (to the right),
// kb > 0 folds the shin back at the knee.
function legPoints(th, kb) {
  const k = rot2([KNEE[0] - HIP[0], KNEE[1] - HIP[1]], -th);
  const f = p => { const v = rot2([p[0] - KNEE[0], p[1] - KNEE[1]], -th + kb); return [k[0] + v[0], k[1] + v[1]]; };
  return { knee: k, heel: f(HEEL), toe: f(TOE) };
}
const stride = g => legPoints(g.A, 0).heel[0] - legPoints(-g.A, 0).heel[0];   // sole travel per stance (src px)
// one leg's pose over the gait cycle: stance sweeps the hip angle linearly (planted foot moves at constant
// speed = ground speed, so no sliding), swing brings it forward with a bent knee.
function legPose(p, g) {
  p = ((p % 1) + 1) % 1;
  if (p < g.s) { const q = p / g.s; return { th: lerp(g.A, -g.A, q), kb: g.kSt * Math.sin(Math.PI * q) }; }
  const q = (p - g.s) / (1 - g.s);
  return { th: lerp(-g.A, g.A, ease.sine(q)), kb: g.kSw * Math.sin(Math.PI * Math.pow(q, .75)) };
}
// ground distance + gait phase, integrated on a 1/600 s grid. Cadence follows speed so feet stay planted.
const INT = { d: [0], p: [0] }, INT_DT = 1 / 600, PHASE0 = .15;
function integ(t) {
  const x = Math.max(0, t - T_WALK), n = Math.floor(x / INT_DT);
  while (INT.d.length <= n + 1) {
    const k = INT.d.length, tm = T_WALK + (k - .5) * INT_DT, v = speed(tm), g = gait(runMix(tm));
    INT.d.push(INT.d[k - 1] + v * INT_DT);
    INT.p.push(INT.p[k - 1] + v * g.s / (stride(g) * S) * INT_DT);
  }
  const f = (x - n * INT_DT) / INT_DT;
  return { dist: lerp(INT.d[n], INT.d[n + 1], f), phase: PHASE0 + lerp(INT.p[n], INT.p[n + 1], f) };
}
// Sczyra walks in from the left; once near 720 the camera follows and the world scrolls instead.
const X0 = 120;
function heroX(t) {
  const d = integ(t).dist, d1 = 420, cap = 600;
  const x = X0 + (d < d1 ? d : d1 + (cap - d1) * (1 - Math.exp(-(d - d1) / (cap - d1))));
  return x + 80 * ease.inOut(seg(t, T_RUN, 9.3)) + 60 * ease.outCubic(seg(t, T_BRAKE, T_STOP));
}
const scrollX = t => integ(t).dist - (heroX(t) - X0);
// heel-strike times (near leg at whole phases, far leg at halves) for dust + footstep SFX
let STEPS = [];
function buildSteps() {
  STEPS = [];
  let prev = Math.floor(integ(T_WALK).phase * 2);
  for (let t = T_WALK; t < T_BRAKE; t += 1 / 600) {
    const c = Math.floor(integ(t).phase * 2);
    if (c !== prev) { STEPS.push({ t, run: runMix(t) > .5 }); prev = c; }
  }
}

const RIGC = canvas(900, 900), RX = RIGC.getContext('2d');
const RIG_O = [450, 400];   // hip position inside RIGC
const DARK = {};
function darkCopy(src) {
  const d = canvas(src.width, src.height), x = d.getContext('2d');
  x.drawImage(src, 0, 0);
  x.globalCompositeOperation = 'source-atop'; x.fillStyle = 'rgba(40,36,96,.24)'; x.fillRect(0, 0, d.width, d.height);
  return d;
}
function drawLeg(th, kb, far) {
  const ti = far ? DARK.thigh : up('rig_thigh', 3), si = far ? DARK.shin : up('rig_shin', 3);
  RX.save();
  RX.translate(RIG_O[0] - (far ? 4 : 0), RIG_O[1] - (far ? 2 : 0)); RX.scale(S, S);
  RX.rotate(-th * DEG);
  RX.drawImage(ti, -HIP[0], -HIP[1], 64, 195);
  RX.translate(KNEE[0] - HIP[0], KNEE[1] - HIP[1]);
  RX.rotate(kb * DEG);
  RX.drawImage(si, -KNEE[0], -KNEE[1], 64, 195);
  RX.restore();
}
function bodyRig(phase, m, g) {
  return {
    regions: [
      R(0, 10, 34, 112, 6, 18, 108, 0, 1.6 + 2.5 * m, .4, 3 + 3 * m, .05, .6, 5, .1),        // hair streaming behind
      R(0, 100, 34, 176, 6, 104, 172, 1, 1.5 + 3 * m, .5, 3.5 + 3 * m, .06, .6, 6, .1),      // hanging sleeve
      R(14, 62, 46, 136, 4, 66, 130, 2 * Math.PI * phase + 1.5 * Math.PI, g.arm, 0, 0, 0),  // arm swings against near leg
      R(36, 95, 62, 126, 4, 100, 124, 2, .8 + m, .3, 5, .08),                                // skirt hem
    ],
    breath: [1, 3, 20, 110], sway: [0, 0],
  };
}
// draw the rigged walker with its hip at screen-x `x`; feet are solved onto groundY
function walker(t, x, gy, { phase, m, legs = null, lean = null, ghosts = 0, alpha = 1 }) {
  const g = gait(m);
  const L = legs || [legPose(phase, g), legPose(phase + .5, g)];
  RX.setTransform(1, 0, 0, 1, 0, 0); RX.clearRect(0, 0, RIGC.width, RIGC.height);
  drawLeg(L[1].th, L[1].kb, true);
  drawLeg(L[0].th, L[0].kb, false);
  warp('rig_body', place(RIG_O[0], RIG_O[1], S, S, lean ?? g.lean, HIP[0], HIP[1]),
    { rig: bodyRig(phase, m, g), t, cam: new DOMMatrix(), target: RX });
  let low = -1e9;
  for (const l of L) { const p = legPoints(l.th, l.kb); low = Math.max(low, p.heel[1], p.toe[1]); }
  const lift = legs ? 0 : m * 24 * Math.pow(Math.max(0, Math.cos(4 * Math.PI * (phase - .44))), 3);
  const hipY = gy - low * S - lift;
  ctx.save();
  ctx.setTransform(CAM);
  for (let k = ghosts; k >= 1; k--) {
    ctx.globalAlpha = alpha * .15 / k;
    ctx.drawImage(RIGC, x - k * 62 - RIG_O[0], hipY - RIG_O[1]);
  }
  ctx.globalAlpha = alpha;

// ---------------------------------------------------------------- scene 5 · turnaround (13 – 17)
// A slow, continuous 360°: each 90° segment morphs one view into the next (width eases toward the
// next silhouette while the images cross-fade), so it reads as one smooth rotation instead of flips.
const VIEWS = ['front', 'side', 'back', 'side2'];

const ROT_A = .35, ROT_B = 3.75;          // rotation window inside the scene (s)
// constant turning speed with soft acceleration / deceleration over the first / last 20 %
function cruise(p, r = .2) {
  const v = 1 / (1 - r);
  if (p < r) return v * p * p / (2 * r);
  if (p > 1 - r) return 1 - v * (1 - p) * (1 - p) / (2 * r);
  return v * (p - r / 2);
}
const turnAngle = w => 360 * cruise(seg(w, ROT_A, ROT_B));
let VIEW_INFO = {};
function measureViews() {   // torso centre-line + width of each view, from its alpha
  for (const n of VIEWS) {
    const im = IMG[n], c = canvas(im.width, im.height), x = c.getContext('2d');
    x.drawImage(im, 0, 0);
    const d = x.getImageData(0, 0, im.width, im.height).data;
    let sx = 0, cnt = 0, wsum = 0, rows = 0;
    for (let y = Math.floor(im.height * .3); y < im.height * .6; y++) {
      let lo = -1, hi = -1;
      for (let i = 0; i < im.width; i++) if (d[(y * im.width + i) * 4 + 3] > 0) { if (lo < 0) lo = i; hi = i; sx += i; cnt++; }
      if (lo >= 0) { wsum += hi - lo + 1; rows++; }
    }
    VIEW_INFO[n] = { cx: sx / cnt, w: wsum / rows };
  }
}

  const im = IMG[name], k = 3.3;

    pixPanel(-290, -50, 580, 100, 10, '#1b2f86', '#e4edff', 5);
    ctx.shadowBlur = 0;
    ctx.font = '40px PS2P'; ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('COMING SOON', 0, 6);
    ctx.restore();
  }
  CAM = new DOMMatrix();
}

// ---------------------------------------------------------------- transitions + frame
function wipe(t) {
  // pixel-block wipe: close-up out, world in (around 6.0)
  const cover = seg(t, 5.62, 6.0), reveal = seg(t, 6.0, 6.38);
  if (cover <= 0 || reveal >= 1) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#080c2a';
  const B = 120;
  for (let j = 0; j < 9; j++) for (let i = 0; i < 16; i++) {
    const d = (i + j * .6) / 21;
    const c = ease.outCubic(clamp((cover - d * .6) / .4)), r = ease.inCubic(clamp((reveal - d * .6) / .4));
    const s = B * (t < 6.0 ? c : 1 - r);
    if (s > .5) ctx.fillRect(i * B + (B - s) / 2, j * B + (B - s) / 2, s + .5, s + .5);
  }
}
const FLASHES = [[3.5, .22, .4, 1], [T_HIT, .02, .3, .55], [T_TURN, .2, .35, 1], [T_FINAL, .22, .45, 1]];
function flash(t) {
  let a = 0;
  for (const [c, rise, fall, k] of FLASHES) {
    if (t < c - rise || t > c + fall) continue;
    a = Math.max(a, k * (t < c ? ease.inCubic(seg(t, c - rise, c)) : 1 - ease.outCubic(seg(t, c, c + fall))));
  }
  if (a > 0) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(235,243,255,${a})`; ctx.fillRect(0, 0, W, H); }
}
window.DURATION = 20;
// key times for music.py (node render.js --events writes build/events.json)
function events() {
  const quarters = [];
  for (let k = 1; k <= 4; k++) {   // when the turntable passes each 90°
    let lo = ROT_A, hi = ROT_B;
    for (let it = 0; it < 40; it++) { const mid = (lo + hi) / 2; if (turnAngle(mid) < k * 90 - 45) lo = mid; else hi = mid; }
    quarters.push(+(T_TURN + lo).toFixed(3));
  }
  return {
    steps: STEPS.map(s => ({ t: +s.t.toFixed(3), run: s.run })),
    walk: T_WALK, run: T_RUN, brake: T_BRAKE, stop: T_STOP, hops: [10.2, 10.55], alert: T_ALERT, jump: T_JUMP,
    slash: T_SLASH, hit: T_HIT, land: T_LAND, turn: T_TURN, turnRot: [T_TURN + ROT_A, T_TURN + ROT_B], quarters, final: T_FINAL,
    happy: 3.5 + EXPR[1][0], wink: 3.5 + EXPR[2][0] + .08, wipe: 5.62,
  };
}
window.render = t => {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0;
  if (t < 3.5) sIntro(t);
  else if (t < T_WALK) sClose(t);
  else if (t < T_TURN) sWorld(t);
  else if (t < T_FINAL) sTurn(t);
  else sFinal(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(VIGNETTE, 0, 0);
  wipe(t);
  flash(t);
  const fin = seg(t, 19.3, 20) + (1 - seg(t, 0, .5));
  if (fin > 0) { ctx.fillStyle = `rgba(0,0,0,${clamp(fin)})`; ctx.fillRect(0, 0, W, H); }
};

window.ready = (async () => {
  await Promise.all([document.fonts.load('700 100px Pixelify'), document.fonts.load('40px Silk'), document.fonts.load('40px PS2P')]);
  await Promise.all(NAMES.map(n => new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(IMG[n] = i); i.onerror = () => rej(new Error('missing ' + n));
    i.src = 'assets/cut/' + n + '.png';
  })));
  buildArt();
  DARK.thigh = darkCopy(up('rig_thigh', 3)); DARK.shin = darkCopy(up('rig_shin', 3));
  measureViews();
  buildSteps();
  window.EVENTS = events();
  window.render(0);
})();
</script>
</body>
